name: MDTerminal

options:
  bundleIdPrefix: it.marcodattisi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: W5GHKK5MCA

packages:
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.90.0
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh.git
    from: 0.13.0
  swiftterm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.20.0

targets:
  MySSHCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/MySSHCore
    dependencies:
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio-ssh
        product: NIOSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.marcodattisi.mdterminal.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES

  MDTerminal-iPad:
    type: application
    platform: iOS
    sources:
      - path: Sources/MySSH
      - path: Assets/iOS.xcassets
        buildPhase: resources
    dependencies:
      - target: MySSHCore
      - package: swiftterm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: MD Terminal
        PRODUCT_BUNDLE_IDENTIFIER: it.marcodattisi.mdterminal
        PRODUCT_MODULE_NAME: MDTerminal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MD Terminal
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 3
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
